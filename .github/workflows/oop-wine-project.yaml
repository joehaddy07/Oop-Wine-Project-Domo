# ==========================================================
# MLOps Wine CI/CD Pipeline
#
# Pipeline Flow
#
# Developer Push
#       │
#       ▼
# Checkout Source Code
#       │
#       ▼
# Install Python
#       │
#       ▼
# Install Dependencies
#       │
#       ▼
# Run Unit Tests
#       │
#       ▼
# Train Machine Learning Model
#       │
#       ▼
# Log Experiment + Register Model with MLflow
#       │
#       ▼
# Login to Docker Hub
#       │
#       ▼
# Build Docker Image with Git SHA
#       │
#       ▼
# Scan Image with Trivy
#       │
#       ▼
# Push Docker Image to Docker Hub
#       │
#       ▼
# Verify joe-cluster
#       │
#       ▼
# Configure kubectl
#       │
#       ▼
# Load Exact Image into Kind
#       │
#       ▼
# Deploy with Helm
#       │
#       ▼
# Verify Deployed Image
#       │
#       ▼
# Wait for Rolling Deployment
#       │
#       ├── SUCCESS → Verify Kubernetes
#       │
#       └── FAILURE → Collect Kubernetes Diagnostics
# ==========================================================

name: Oop Wine CI/CD Pipeline


# ==========================================================
# TRIGGER
# ==========================================================

on:
  push:
    branches:
      - main


# ==========================================================
# ENVIRONMENT VARIABLES
# ==========================================================

env:

  # Python version
  PYTHON_VERSION: "3.12"

  # Docker image name
  IMAGE_NAME: wine-streamlit-app

  # Git commit SHA = immutable image version
  IMAGE_TAG: ${{ github.sha }}

  # Helm release
  HELM_RELEASE: Oop-wine-app

  # Helm chart
  HELM_CHART: ./helm/wine

  # Kind cluster
  KIND_CLUSTER: joe-cluster


# ==========================================================
# JOBS
# ==========================================================

jobs:


  # ========================================================
  # JOB 1
  # Build
  # Test
  # Train
  # MLflow
  # Docker Build
  # Trivy Vulnerability Scan
  # Docker Push
  # ========================================================
# ==========================================================
# JOB 1: BUILD / TEST / TRAIN / DOCKER
# ==========================================================

 build-train:

  runs-on: self-hosted

  steps:

    # ------------------------------------------------------
    # STEP 1: Checkout
    # ------------------------------------------------------

    - name: Checkout Source Code
      uses: actions/checkout@v4


    # ------------------------------------------------------
    # STEP 2: Setup Python
    # ------------------------------------------------------

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}


    # ------------------------------------------------------
    # STEP 3: Install Dependencies
    # ------------------------------------------------------

    - name: Install Python Dependencies
      run: |

        python -m pip install --upgrade pip wheel

        if [ -f requirements-dev.txt ]; then
          pip install --only-binary pandas,numpy,scikit-learn,scipy \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-dev.txt
        fi

        if [ -f requirements.txt ]; then
          pip install --only-binary pandas,numpy,scikit-learn,scipy \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt
        fi


    # ------------------------------------------------------
    # STEP 4: Run Tests
    # ------------------------------------------------------

    - name: Run Tests
      run: |
        python -m pytest


    # ------------------------------------------------------
    # STEP 5: Login to Docker Hub
    # ------------------------------------------------------

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}


    # ------------------------------------------------------
    # STEP 6: Build Docker Image
    # ------------------------------------------------------

    - name: Build Docker Image
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |

        IMAGE_NAME="${{ env.IMAGE_NAME }}"
        IMAGE_TAG="${{ env.IMAGE_TAG }}"

        # Local image using Git SHA.
        LOCAL_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

        # Docker Hub image using the SAME Git SHA.
        REMOTE_IMAGE="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"

        echo "======================================"
        echo "Building Docker Image"
        echo "======================================"

        echo "Local Image:"
        echo "$LOCAL_IMAGE"

        echo "Remote Image:"
        echo "$REMOTE_IMAGE"

        # Build the image locally.
        docker build \
          -t "$LOCAL_IMAGE" \
          .

        # Tag the exact same image for Docker Hub.
        docker tag \
          "$LOCAL_IMAGE" \
          "$REMOTE_IMAGE"

        # Verify the local image exists.
        docker image inspect "$LOCAL_IMAGE"

        # Verify the Docker Hub tagged image exists locally.
        docker image inspect "$REMOTE_IMAGE"


    # ------------------------------------------------------
    # STEP 7: Push Git SHA Image to Docker Hub
    # ------------------------------------------------------

    - name: Push Docker Image
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |

        IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

        echo "======================================"
        echo "Pushing Docker Image"
        echo "======================================"

        echo "Image:"
        echo "$IMAGE"

        docker push "$IMAGE"


# ==========================================================
# JOB 2: KUBERNETES + HELM DEPLOYMENT
# ==========================================================

 deploy:

  needs: build-train

  runs-on: self-hosted

  steps:

    # ------------------------------------------------------
    # STEP 8: Checkout Repository
    # ------------------------------------------------------

    - name: Checkout Repository
      uses: actions/checkout@v4


    # ------------------------------------------------------
    # STEP 9: Verify Docker
    # ------------------------------------------------------

    - name: Verify Docker
      run: |
        echo "======================================"
        echo "Docker Version"
        echo "======================================"

        docker version


    # ------------------------------------------------------
    # STEP 10: Login to Docker Hub
    # ------------------------------------------------------

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}


    # ------------------------------------------------------
    # STEP 11: Verify Kind
    # ------------------------------------------------------

    - name: Verify Kind
      run: |

        echo "======================================"
        echo "Kind Version"
        echo "======================================"

        kind version

        echo ""
        echo "Available Kind Clusters:"

        kind get clusters


    # ------------------------------------------------------
    # STEP 12: Verify joe-cluster
    # ------------------------------------------------------

    - name: Verify joe-cluster
      run: |

        echo "======================================"
        echo "Checking Kind Cluster"
        echo "======================================"

        kind get clusters | grep -x "${{ env.KIND_CLUSTER }}"

        echo "joe-cluster exists."


    # ------------------------------------------------------
    # STEP 13: Configure kubectl
    # ------------------------------------------------------

    - name: Configure kubectl for joe-cluster
      run: |

        echo "======================================"
        echo "Configuring kubectl"
        echo "======================================"

        kind export kubeconfig \
          --name "${{ env.KIND_CLUSTER }}"

        kubectl config use-context \
          "kind-${{ env.KIND_CLUSTER }}"


    # ------------------------------------------------------
    # STEP 14: Verify Kubernetes
    # ------------------------------------------------------

    - name: Verify Kubernetes Cluster
      run: |

        echo "======================================"
        echo "Kubernetes Cluster"
        echo "======================================"

        kubectl config current-context

        echo ""

        kubectl get nodes -o wide

        echo ""

        kubectl cluster-info


    # ------------------------------------------------------
    # STEP 15: Pull Exact Git SHA Image
    # ------------------------------------------------------

    - name: Pull Exact Git SHA Image
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |

        IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

        echo "======================================"
        echo "Pulling Exact Git SHA Image"
        echo "======================================"

        echo "Image:"
        echo "$IMAGE"

        # Pull the exact image created by the build job.
        docker pull "$IMAGE"

        # Confirm the image exists locally.
        docker image inspect "$IMAGE"


    # ------------------------------------------------------
    # STEP 16: Load Exact Git SHA Image into Kind
    # ------------------------------------------------------

    - name: Load Image into joe-cluster
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |

        IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

        echo "======================================"
        echo "Loading Exact Image into Kind"
        echo "======================================"

        echo "Image:"
        echo "$IMAGE"

        # Confirm image exists before loading into Kind.
        docker image inspect "$IMAGE"

        # Load the exact Git SHA image into Kind.
        kind load docker-image \
          "$IMAGE" \
          --name "${{ env.KIND_CLUSTER }}"


    # ------------------------------------------------------
    # STEP 17: Verify Image Inside Kind
    # ------------------------------------------------------

    - name: Verify Image in Kind
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |

        IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

        echo "======================================"
        echo "Verifying Image Inside Kind"
        echo "======================================"

        echo "Expected image:"
        echo "$IMAGE"

        docker exec \
          "${{ env.KIND_CLUSTER }}-control-plane" \
          crictl images | grep "${{ env.IMAGE_NAME }}"

        echo ""
        echo "Kind image verification complete."


    # ------------------------------------------------------
    # STEP 18: Verify Helm
    # ------------------------------------------------------

    - name: Verify Helm
      run: |

        echo "======================================"
        echo "Helm Version"
        echo "======================================"

        helm version


    # ------------------------------------------------------
    # STEP 19: Helm Lint
    # ------------------------------------------------------

    - name: Helm Lint
      run: |

        echo "======================================"
        echo "Helm Lint"
        echo "======================================"

        helm lint "${{ env.HELM_CHART }}"


    # ------------------------------------------------------
    # STEP 20: Deploy with Helm
    # ------------------------------------------------------

    - name: Deploy Application with Helm
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |

        IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}"

        echo "======================================"
        echo "Deploying Application with Helm"
        echo "======================================"

        echo "Repository:"
        echo "$IMAGE"

        echo "Git SHA:"
        echo "${{ env.IMAGE_TAG }}"

        echo "Full Image:"
        echo "${IMAGE}:${{ env.IMAGE_TAG }}"

        helm upgrade --install \
          "${{ env.HELM_RELEASE }}" \
          "${{ env.HELM_CHART }}" \
          --set image.repository="$IMAGE" \
          --set image.tag="${{ env.IMAGE_TAG }}" \
          --set image.pullPolicy=IfNotPresent \
          --set replicaCount=3 \
          --wait


    # ------------------------------------------------------
    # STEP 21: Verify Deployed Image
    # ------------------------------------------------------

    - name: Verify Deployed Image
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |

        EXPECTED_IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

        echo "======================================"
        echo "Verifying Kubernetes Image"
        echo "======================================"

        DEPLOYED_IMAGE=$(kubectl get deployment wine-app \
          -o jsonpath='{.spec.template.spec.containers[0].image}')

        echo "Expected:"
        echo "$EXPECTED_IMAGE"

        echo ""

        echo "Deployed:"
        echo "$DEPLOYED_IMAGE"

        echo ""

        if [ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]; then
          echo "ERROR: Kubernetes is running the wrong image."
          exit 1
        fi

        echo "Correct Git SHA image is deployed."


    # ------------------------------------------------------
    # STEP 22: Wait for Deployment
    # ------------------------------------------------------

    - name: Wait for Deployment
      run: |

        echo "======================================"
        echo "Waiting for Kubernetes Rollout"
        echo "======================================"

        kubectl rollout status \
          deployment/wine-app \
          --timeout=300s


    # ------------------------------------------------------
    # STEP 23: Verify Pods
    # ------------------------------------------------------

    - name: Verify Pods
      run: |

        echo "======================================"
        echo "Pods Status"
        echo "======================================"

        kubectl get pods -o wide


    # ------------------------------------------------------
    # STEP 24: Verify Services
    # ------------------------------------------------------

    - name: Verify Services
      run: |

        echo "======================================"
        echo "Services Status"
        echo "======================================"

        kubectl get svc


    # ------------------------------------------------------
    # STEP 25: Verify Deployments
    # ------------------------------------------------------

    - name: Verify Deployments
      run: |

        echo "======================================"
        echo "Deployment Status"
        echo "======================================"

        kubectl get deployments


    # ------------------------------------------------------
    # STEP 26: Describe Deployment
    # ------------------------------------------------------

    - name: Describe Deployment
      run: |

        echo "======================================"
        echo "Deployment Description"
        echo "======================================"

        kubectl describe deployment wine-app


    # ======================================================
    # FAILURE DIAGNOSTICS
    # ======================================================

    # ------------------------------------------------------
    # STEP 27: Kubernetes Diagnostics
    # ------------------------------------------------------

    - name: DEBUG - Kubernetes State
      if: failure()
      run: |

        echo "======================================"
        echo "KUBERNETES FAILURE DIAGNOSTICS"
        echo "======================================"

        echo ""
        echo "=== All Resources ==="
        kubectl get all -A || true

        echo ""
        echo "=== Deployments ==="
        kubectl get deployments -A || true

        echo ""
        echo "=== Pods ==="
        kubectl get pods -A -o wide || true

        echo ""
        echo "=== Services ==="
        kubectl get svc -A || true

        echo ""
        echo "=== ReplicaSets ==="
        kubectl get replicasets -A || true

        echo ""
        echo "=== Helm Releases ==="
        helm list -A || true

        echo ""
        echo "=== Deployment wine-app ==="
        kubectl get deployment wine-app -o yaml || true

        echo ""
        echo "=== Kubernetes Events ==="
        kubectl get events \
          -A \
          --sort-by=.lastTimestamp || true


    # ------------------------------------------------------
    # STEP 28: Application Logs
    # ------------------------------------------------------

    - name: DEBUG - Application Logs
      if: failure()
      run: |

        echo "======================================"
        echo "APPLICATION LOGS"
        echo "======================================"

        kubectl logs \
          -l app=wine-app \
          --all-containers=true \
          --tail=200 \
          --prefix=true || true


    # ------------------------------------------------------
    # STEP 29: Final Kubernetes State
    # ------------------------------------------------------

    - name: DEBUG - Final Kubernetes State
      if: failure()
      run: |

        echo "======================================"
        echo "FINAL KUBERNETES STATE"
        echo "======================================"

        kubectl get all -A || true

        echo ""

        kubectl get deployments -A || true

        echo ""

        kubectl get pods -A -o wide || true

        echo ""

        kubectl get svc -A || true


    # ------------------------------------------------------
    # STEP 30: Final Verification
    # ------------------------------------------------------

    - name: Final Kubernetes Verification
      run: |

        echo "======================================"
        echo "FINAL KUBERNETES VERIFICATION"
        echo "======================================"

        echo "Cluster:"
        echo "${{ env.KIND_CLUSTER }}"

        echo ""

        echo "Context:"
        kubectl config current-context

        echo ""

        echo "Nodes:"
        kubectl get nodes

        echo ""

        echo "Pods:"
        kubectl get pods

        echo ""

        echo "Services:"
        kubectl get svc

        echo ""

        echo "Deployments:"
        kubectl get deployments


    # ------------------------------------------------------
    # STEP 31: Completion Summary
    # ------------------------------------------------------

    - name: Pipeline Completed Successfully
      if: success()
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |

        echo "======================================"
        echo "MLOps Pipeline Completed Successfully"
        echo "======================================"

        echo "Docker Image:"
        echo "${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

        echo ""

        echo "Git SHA:"
        echo "${{ env.IMAGE_TAG }}"

        echo ""

        echo "Kind Cluster:"
        echo "${{ env.KIND_CLUSTER }}"

        echo ""

        echo "Helm Release:"
        echo "${{ env.HELM_RELEASE }}"

        echo ""

        echo "Deployment:"
        echo "wine-app"

        echo ""

        echo "Rollout:"
        echo "SUCCESS"
