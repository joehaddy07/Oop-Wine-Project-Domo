# ==========================================================
# MLOps Wine CI/CD Pipeline
#
# Pipeline Flow:
# Checkout -> Setup Python -> Install Deps -> Train/MLflow -> 
# Build Docker -> Load Kind -> Helm Deploy -> Verify Rollout
# ==========================================================

name: Oop Wine CI/CD Pipeline

# ==========================================================
# TRIGGER
# ==========================================================

on:
  push:
    branches:
      - main

# ==========================================================
# ENVIRONMENT VARIABLES
# ==========================================================

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: wine-streamlit-app
  IMAGE_TAG: ${{ github.sha }}
  HELM_RELEASE: Oop-wine-app
  HELM_CHART: ./helm/wine
  KIND_CLUSTER: joe-cluster
  K8S_NAMESPACE: dev

# ==========================================================
# JOBS
# ==========================================================

jobs:

  # ========================================================
  # JOB 1: Build, Train & Containerize
  # ========================================================
  build-train:
    runs-on: self-hosted

    steps:
      # ------------------------------------------------------
      # STEP 1: Checkout Source Code
      # ------------------------------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # STEP 2: Setup Python
      # ------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ------------------------------------------------------
      # STEP 3: Install Dependencies
      # ------------------------------------------------------
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip wheel
          if [ -f requirements-dev.txt ]; then
            pip install --only-binary pandas,numpy,scikit-learn,scipy \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -r requirements-dev.txt
          fi

          if [ -f requirements.txt ]; then
            pip install --only-binary pandas,numpy,scikit-learn,scipy \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -r requirements.txt
          fi

      # ------------------------------------------------------
      # STEP 4: Build Local Docker Image (With Clean Prefix Guard)
      # ------------------------------------------------------
      - name: Build Docker Image
        run: |
          DUSER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -n "$DUSER" ]; then
            FULL_IMAGE="${DUSER}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          else
            FULL_IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          fi

          echo "Building Docker image: $FULL_IMAGE"
          docker build -t "$FULL_IMAGE" .
          docker tag "$FULL_IMAGE" "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

  # ========================================================
  # JOB 2: Kubernetes & Helm Deployment
  # ========================================================
  deploy:
    needs: build-train
    runs-on: self-hosted

    steps:
      # ------------------------------------------------------
      # STEP 5: Checkout Repository
      # ------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # STEP 6: Verify Environment
      # ------------------------------------------------------
      - name: Verify Docker & Kind
        run: |
          echo "======================================"
          echo "Verifying Tooling & Cluster"
          echo "======================================"
          docker version
          kind version
          kind get clusters | grep -x "${{ env.KIND_CLUSTER }}"

      # ------------------------------------------------------
      # STEP 7: Configure kubectl
      # ------------------------------------------------------
      - name: Configure kubectl for joe-cluster
        run: |
          kind export kubeconfig --name ${{ env.KIND_CLUSTER }}
          kubectl config use-context kind-${{ env.KIND_CLUSTER }}
          kubectl cluster-info

      # ------------------------------------------------------
      # STEP 8: Load Image into Kind (Guarded Against Leading Slash)
      # ------------------------------------------------------
      - name: Load Image into joe-cluster
        run: |
          echo "======================================"
          echo "Loading Exact Image into Kind"
          echo "======================================"

          DUSER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -n "$DUSER" ]; then
            IMAGE_TO_LOAD="${DUSER}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          else
            IMAGE_TO_LOAD="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          fi

          echo "Target Image: $IMAGE_TO_LOAD"

          kind load docker-image "$IMAGE_TO_LOAD" --name ${{ env.KIND_CLUSTER }}

      # ------------------------------------------------------
      # STEP 9: Verify Image Inside Kind Nodes
      # ------------------------------------------------------
      - name: Verify Image in Kind
        run: |
          docker exec ${{ env.KIND_CLUSTER }}-control-plane crictl images | grep "${{ env.IMAGE_NAME }}" || true

      # ------------------------------------------------------
      # STEP 10: Deploy via Helm
      # ------------------------------------------------------
      - name: Deploy Application with Helm
        run: |
          echo "======================================"
          echo "Deploying Application via Helm"
          echo "======================================"

          DUSER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -n "$DUSER" ]; then
            REPO_PATH="${DUSER}/${{ env.IMAGE_NAME }}"
          else
            REPO_PATH="${{ env.IMAGE_NAME }}"
          fi

          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install \
            ${{ env.HELM_RELEASE }} \
            ${{ env.HELM_CHART }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.repository="$REPO_PATH" \
            --set image.tag="${{ env.IMAGE_TAG }}" \
            --set image.pullPolicy=IfNotPresent \
            --wait=false

      # ------------------------------------------------------
      # STEP 11: Wait & Verify Rollout Status
      # ------------------------------------------------------
      - name: Wait for Kubernetes Rollout
        run: |
          echo "======================================"
          echo "Waiting for Deployment Rollout"
          echo "======================================"

          # Automatically find target deployment name in namespace
          DEPLOYMENT_NAME=$(kubectl get deployments -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.items[0].metadata.name}')
          echo "Detected Deployment: $DEPLOYMENT_NAME"

          kubectl rollout status deployment/$DEPLOYMENT_NAME -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      # ------------------------------------------------------
      # STEP 12: Verify Kubernetes Resources
      # ------------------------------------------------------
      - name: Verify Resources Status
        run: |
          echo "======================================"
          echo "Current Namespace Resources State"
          echo "======================================"
          kubectl get all -n ${{ env.K8S_NAMESPACE }} -o wide

      # ======================================================
      # FAILURE DIAGNOSTICS
      # ======================================================
      - name: DEBUG - Collect Failure Context
        if: failure()
        run: |
          echo "======================================"
          echo "DEBUG: POD DESCRIPTIONS & LOGS"
          echo "======================================"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
          kubectl describe pods -n ${{ env.K8S_NAMESPACE }}
          kubectl logs -n ${{ env.K8S_NAMESPACE }} --all-containers=true --tail=200 --prefix=true || true