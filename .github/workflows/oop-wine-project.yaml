
# ==========================================================
# MLOps Wine CI/CD Pipeline
#
# Pipeline Flow
#
# Developer Push
#       │
#       ▼
# Checkout Source Code
#       │
#       ▼
# Install Python
#       │
#       ▼
# Install Dependencies
#       │
#       ▼
# Run Unit Tests
#       │
#       ▼
# Train Machine Learning Model
#       │
#       ▼
# Log Experiment + Register Model with MLflow
#       │
#       ▼
# Login to Docker Hub
#       │
#       ▼
# Build Docker Image with Git SHA
#       │
#       ▼
# Scan Image with Trivy
#       │
#       ▼
# Push Docker Image to Docker Hub
#       │
#       ▼
# Verify joe-cluster
#       │
#       ▼
# Configure kubectl
#       │
#       ▼
# Pull Exact Git SHA Image
#       │
#       ▼
# Load Exact Image into Kind
#       │
#       ▼
# Deploy with Helm
#       │
#       ▼
# Verify Deployed Image
#       │
#       ▼
# Wait for Rolling Deployment
#       │
#       ├── SUCCESS → Verify Kubernetes
#       │
#       └── FAILURE → Collect Kubernetes Diagnostics
# ==========================================================


name: Oop Wine CI/CD Pipeline


# ==========================================================
# TRIGGER
# ==========================================================

on:
  push:
    branches:
      - main


# ==========================================================
# ENVIRONMENT VARIABLES
# ==========================================================

env:

  # Python version
  PYTHON_VERSION: "3.12"

  # Docker image name
  IMAGE_NAME: oop-wine-streamlit-app

  # Git commit SHA = immutable image version
  IMAGE_TAG: ${{ github.sha }}

  # Helm release
  # This is also the Kubernetes Deployment name.
  HELM_RELEASE: oop-wine-app

  # Helm chart
  HELM_CHART: ./helm/wine

  # Kind cluster
  KIND_CLUSTER: joe-cluster


# ==========================================================
# JOBS
# ==========================================================

jobs:


  # ========================================================
  # JOB 1
  #
  # Build
  # Test
  # Train
  # MLflow
  # Docker Build
  # Trivy Vulnerability Scan
  # Docker Push
  # ========================================================

  build-train:

    runs-on: self-hosted

    steps:


      # ------------------------------------------------------
      # STEP 1: Checkout
      # ------------------------------------------------------

      - name: Checkout Source Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 2: Setup Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # ------------------------------------------------------
      # STEP 3: Install Dependencies
      # ------------------------------------------------------

      - name: Install Python Dependencies
        run: |

          echo "======================================"
          echo "Installing Python Dependencies"
          echo "======================================"

          python -m pip install --upgrade pip wheel

          if [ -f requirements-dev.txt ]; then

            pip install \
              --only-binary pandas,numpy,scikit-learn,scipy \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -r requirements-dev.txt

          fi

          if [ -f requirements.txt ]; then

            pip install \
              --only-binary pandas,numpy,scikit-learn,scipy \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -r requirements.txt

          fi


      # ------------------------------------------------------
      # STEP 4: Run Unit Tests
      # ------------------------------------------------------

      - name: Run Unit Tests
        run: |

          echo "======================================"
          echo "Running Unit Tests"
          echo "======================================"

          pytest -v


      # ------------------------------------------------------
      # STEP 5: Train Machine Learning Model
      # ------------------------------------------------------

      - name: Train Machine Learning Model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |

          echo "======================================"
          echo "Training Machine Learning Model"
          echo "======================================"

          python -m src.main


      # ------------------------------------------------------
      # STEP 6: Verify Docker Hub Username
      # ------------------------------------------------------

      - name: Verify Docker Hub Username
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Verifying Docker Hub Username"
          echo "======================================"

          if [ -z "$DOCKERHUB_USERNAME" ]; then

            echo "ERROR: DOCKERHUB_USERNAME is EMPTY"

            exit 1

          fi

          echo "Docker Hub username is configured."


      # ------------------------------------------------------
      # STEP 7: Login to Docker Hub
      # ------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ------------------------------------------------------
      # STEP 8: Build Docker Image
      # ------------------------------------------------------

      - name: Build Docker Image
        run: |

          echo "======================================"
          echo "Building Docker Image"
          echo "======================================"

          LOCAL_IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Local image:"
          echo "$LOCAL_IMAGE"

          docker build \
            -f app/Dockerfile \
            -t "$LOCAL_IMAGE" \
            .


      # ------------------------------------------------------
      # STEP 9: Verify Local Docker Image
      # ------------------------------------------------------

      - name: Verify Local Docker Image
        run: |

          echo "======================================"
          echo "Verifying Local Docker Image"
          echo "======================================"

          LOCAL_IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          docker image inspect "$LOCAL_IMAGE"


      # ------------------------------------------------------
      # STEP 10: Tag Docker Image
      # ------------------------------------------------------

      - name: Tag Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Tagging Docker Image"
          echo "======================================"

          LOCAL_IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          REMOTE_IMAGE="$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Local image:"
          echo "$LOCAL_IMAGE"

          echo ""

          echo "Remote image:"
          echo "$REMOTE_IMAGE"

          docker tag \
            "$LOCAL_IMAGE" \
            "$REMOTE_IMAGE"


      # ------------------------------------------------------
      # STEP 11: Scan Docker Image with Trivy
      # ------------------------------------------------------

      - name: Scan Docker Image with Trivy
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Scanning Docker Image"
          echo "======================================"

          REMOTE_IMAGE="$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Scanning:"
          echo "$REMOTE_IMAGE"

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$REMOTE_IMAGE"


      # ------------------------------------------------------
      # STEP 12: Push Docker Image
      # ------------------------------------------------------

      - name: Push Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Pushing Docker Image"
          echo "======================================"

          REMOTE_IMAGE="$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Pushing:"
          echo "$REMOTE_IMAGE"

          docker push "$REMOTE_IMAGE"


  # ========================================================
  # JOB 2
  #
  # Kubernetes + Helm Deployment
  # ========================================================

  deploy:

    needs: build-train

    runs-on: self-hosted

    steps:


      # ------------------------------------------------------
      # STEP 13: Checkout Repository
      # ------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 14: Verify Docker
      # ------------------------------------------------------

      - name: Verify Docker
        run: |

          echo "======================================"
          echo "Docker Version"
          echo "======================================"

          docker version


      # ------------------------------------------------------
      # STEP 15: Verify Docker Hub Username
      # ------------------------------------------------------

      - name: Verify Docker Hub Username
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Verifying Docker Hub Configuration"
          echo "======================================"

          if [ -z "$DOCKERHUB_USERNAME" ]; then

            echo "ERROR: DOCKERHUB_USERNAME is EMPTY"

            exit 1

          fi

          echo "Docker Hub username is configured."


      # ------------------------------------------------------
      # STEP 16: Login to Docker Hub
      # ------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ------------------------------------------------------
      # STEP 17: Pull Exact Git SHA Image
      #
      # IMPORTANT:
      #
      # build-train and deploy are separate jobs.
      #
      # Therefore the Docker image built in build-train
      # is not assumed to exist locally in deploy.
      #
      # We pull the exact image from Docker Hub first.
      # ------------------------------------------------------

      - name: Pull Exact Git SHA Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Pulling Exact Git SHA Image"
          echo "======================================"

          IMAGE="$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Image:"
          echo "$IMAGE"

          echo ""

          echo "Pulling image from Docker Hub..."

          docker pull "$IMAGE"

          echo ""

          echo "Verifying image exists locally..."

          docker image inspect "$IMAGE"

          echo ""

          echo "Image successfully pulled."


      # ------------------------------------------------------
      # STEP 18: Verify Kind
      # ------------------------------------------------------

      - name: Verify Kind
        run: |

          echo "======================================"
          echo "Kind Version"
          echo "======================================"

          kind version

          echo ""

          echo "Available Kind Clusters:"

          kind get clusters


      # ------------------------------------------------------
      # STEP 19: Verify joe-cluster
      # ------------------------------------------------------

      - name: Verify joe-cluster
        run: |

          echo "======================================"
          echo "Checking Kind Cluster"
          echo "======================================"

          if ! kind get clusters | grep -x "${{ env.KIND_CLUSTER }}"; then

            echo "ERROR: Kind cluster '${{ env.KIND_CLUSTER }}' does not exist."

            exit 1

          fi

          echo "${{ env.KIND_CLUSTER }} exists."


      # ------------------------------------------------------
      # STEP 20: Configure kubectl
      # ------------------------------------------------------

      - name: Configure kubectl for joe-cluster
        run: |

          echo "======================================"
          echo "Configuring kubectl"
          echo "======================================"

          kind export kubeconfig \
            --name "${{ env.KIND_CLUSTER }}"

          kubectl config use-context \
            "kind-${{ env.KIND_CLUSTER }}"


      # ------------------------------------------------------
      # STEP 21: Verify Kubernetes
      # ------------------------------------------------------

      - name: Verify Kubernetes Cluster
        run: |

          echo "======================================"
          echo "Kubernetes Cluster"
          echo "======================================"

          kubectl config current-context

          echo ""

          kubectl get nodes -o wide

          echo ""

          kubectl cluster-info


      # ------------------------------------------------------
      # STEP 22: Load Exact Git SHA Image into Kind
      # ------------------------------------------------------

      - name: Load Image into joe-cluster
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Loading Exact Image into Kind"
          echo "======================================"

          IMAGE="$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Image:"
          echo "$IMAGE"

          echo ""

          echo "Checking local Docker image..."

          docker image inspect "$IMAGE"

          echo ""

          echo "Loading image into Kind..."

          kind load docker-image \
            --name "${{ env.KIND_CLUSTER }}" \
            "$IMAGE"

          echo ""

          echo "Image successfully loaded into Kind."


      # ------------------------------------------------------
      # STEP 23: Verify Image Inside Kind
      # ------------------------------------------------------

      - name: Verify Image in Kind
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Verifying Image Inside Kind"
          echo "======================================"

          IMAGE="$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Expected image:"
          echo "$IMAGE"

          echo ""

          echo "Images inside Kind:"

          docker exec \
            "${{ env.KIND_CLUSTER }}-control-plane" \
            crictl images

          echo ""

          echo "Checking for expected image..."

          if ! docker exec \
            "${{ env.KIND_CLUSTER }}-control-plane" \
            crictl images | grep "${{ env.IMAGE_NAME }}"; then

            echo "ERROR: Expected image was not found inside Kind."

            exit 1

          fi

          echo ""

          echo "Image verified inside Kind."


      # ------------------------------------------------------
      # STEP 24: Verify Helm
      # ------------------------------------------------------

      - name: Verify Helm
        run: |

          echo "======================================"
          echo "Helm Version"
          echo "======================================"

          helm version


      # ------------------------------------------------------
      # STEP 25: Helm Lint
      # ------------------------------------------------------

      - name: Helm Lint
        run: |

          echo "======================================"
          echo "Helm Lint"
          echo "======================================"

          helm lint \
            "${{ env.HELM_CHART }}"


      # ------------------------------------------------------
      # STEP 26: Deploy with Helm
      # ------------------------------------------------------

      - name: Deploy Application with Helm
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Deploying Application"
          echo "======================================"

          IMAGE="$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}"

          FULL_IMAGE="$IMAGE:${{ env.IMAGE_TAG }}"

          echo "Repository:"
          echo "$IMAGE"

          echo ""

          echo "Full image:"
          echo "$FULL_IMAGE"

          echo ""

          echo "Helm release:"
          echo "${{ env.HELM_RELEASE }}"

          echo ""

          echo "Helm chart:"
          echo "${{ env.HELM_CHART }}"

          echo ""

          helm upgrade --install \
            "${{ env.HELM_RELEASE }}" \
            "${{ env.HELM_CHART }}" \
            --set image.repository="$IMAGE" \
            --set image.tag="${{ env.IMAGE_TAG }}" \
            --set image.pullPolicy=IfNotPresent \
            --set replicaCount=3 \
            --wait=false


      # ------------------------------------------------------
      # STEP 27: Verify Deployed Image
      # ------------------------------------------------------

      - name: Verify Deployed Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Verifying Kubernetes Image"
          echo "======================================"

          DEPLOYED_IMAGE=$(kubectl get deployment \
            "${{ env.HELM_RELEASE }}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          EXPECTED_IMAGE="$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Expected:"
          echo "$EXPECTED_IMAGE"

          echo ""

          echo "Deployed:"
          echo "$DEPLOYED_IMAGE"

          echo ""

          if [ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]; then

            echo "ERROR: Kubernetes is running the wrong image."

            exit 1

          fi

          echo "Correct image is deployed."


      # ------------------------------------------------------
      # STEP 28: Show Rollout Status
      # ------------------------------------------------------

      - name: Show Rollout Status
        run: |

          echo "======================================"
          echo "Current Rollout Status"
          echo "======================================"

          kubectl rollout status \
            "deployment/${{ env.HELM_RELEASE }}" \
            --timeout=10s || true


      # ------------------------------------------------------
      # STEP 29: Wait for Deployment
      # ------------------------------------------------------

      - name: Wait for Deployment
        run: |

          echo "======================================"
          echo "Waiting for Kubernetes Rollout"
          echo "======================================"

          kubectl rollout status \
            "deployment/${{ env.HELM_RELEASE }}" \
            --timeout=300s


      # ------------------------------------------------------
      # STEP 30: Verify Pods
      # ------------------------------------------------------

      - name: Verify Pods
        run: |

          echo "======================================"
          echo "Pods Status"
          echo "======================================"

          kubectl get pods \
            -o wide


      # ------------------------------------------------------
      # STEP 31: Verify Services
      # ------------------------------------------------------

      - name: Verify Services
        run: |

          echo "======================================"
          echo "Services Status"
          echo "======================================"

          kubectl get svc


      # ------------------------------------------------------
      # STEP 32: Verify Deployments
      # ------------------------------------------------------

      - name: Verify Deployments
        run: |

          echo "======================================"
          echo "Deployment Status"
          echo "======================================"

          kubectl get deployments


      # ------------------------------------------------------
      # STEP 33: Describe Deployment
      # ------------------------------------------------------

      - name: Describe Deployment
        run: |

          echo "======================================"
          echo "Deployment Description"
          echo "======================================"

          kubectl describe deployment \
            "${{ env.HELM_RELEASE }}"


      # ======================================================
      # FAILURE DIAGNOSTICS
      #
      # These steps execute ONLY if something above fails.
      # ======================================================


      # ------------------------------------------------------
      # STEP 34: Debug Pods
      # ------------------------------------------------------

      - name: DEBUG - Kubernetes Pods
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: PODS"
          echo "======================================"

          kubectl get pods \
            -o wide


      # ------------------------------------------------------
      # STEP 35: Debug ReplicaSets
      # ------------------------------------------------------

      - name: DEBUG - ReplicaSets
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: REPLICASETS"
          echo "======================================"

          kubectl get replicasets \
            -o wide


      # ------------------------------------------------------
      # STEP 36: Debug Deployment
      # ------------------------------------------------------

      - name: DEBUG - Deployment
      # Always attempt diagnostics even when the deployment
      # itself does not exist.
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: DEPLOYMENT"
          echo "======================================"

          kubectl describe deployment \
            "${{ env.HELM_RELEASE }}" || true


      # ------------------------------------------------------
      # STEP 37: Debug Pod Descriptions
      # ------------------------------------------------------

      - name: DEBUG - Describe Pods
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: POD DESCRIPTIONS"
          echo "======================================"

          kubectl describe pods \
            -l app=${{ env.HELM_RELEASE }} || true


      # ------------------------------------------------------
      # STEP 38: Debug Events
      # ------------------------------------------------------

      - name: DEBUG - Kubernetes Events
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: KUBERNETES EVENTS"
          echo "======================================"

          kubectl get events \
            --sort-by=.lastTimestamp


      # ------------------------------------------------------
      # STEP 39: Debug Application Logs
      # ------------------------------------------------------

      - name: DEBUG - Application Logs
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: APPLICATION LOGS"
          echo "======================================"

          kubectl logs \
            -l app=${{ env.HELM_RELEASE }} \
            --all-containers=true \
            --tail=200 \
            --prefix=true || true


      # ------------------------------------------------------
      # STEP 40: Previous Container Logs
      # ------------------------------------------------------

      - name: DEBUG - Previous Container Logs
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: PREVIOUS CONTAINER LOGS"
          echo "======================================"

          for POD in $(kubectl get pods \
            -l app=${{ env.HELM_RELEASE }} \
            -o jsonpath='{.items[*].metadata.name}'); do

            echo ""
            echo "======================================"
            echo "Pod: $POD"
            echo "======================================"

            kubectl logs "$POD" \
              --previous \
              --all-containers=true \
              --tail=200 || true

          done


      # ------------------------------------------------------
      # STEP 41: Final Kubernetes State
      # ------------------------------------------------------

      - name: DEBUG - Final Kubernetes State
        if: failure()
        run: |

          echo "======================================"
          echo "FINAL KUBERNETES STATE"
          echo "======================================"

          kubectl get all \
            -l app=${{ env.HELM_RELEASE }} || true

          echo ""

          kubectl get deployment \
            "${{ env.HELM_RELEASE }}" \
            -o yaml || true


      # ------------------------------------------------------
      # STEP 42: Final Verification
      # ------------------------------------------------------

      - name: Final Kubernetes Verification
        run: |

          echo "======================================"
          echo "FINAL KUBERNETES VERIFICATION"
          echo "======================================"

          echo "Cluster:"
          echo "${{ env.KIND_CLUSTER }}"

          echo ""

          echo "Context:"
          kubectl config current-context

          echo ""

          kubectl get nodes

          echo ""

          kubectl get pods

          echo ""

          kubectl get svc

          echo ""

          kubectl get deployments


      # ------------------------------------------------------
      # STEP 43: Completion Summary
      # ------------------------------------------------------

      - name: Pipeline Completed Successfully
        if: success()
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "MLOps Pipeline Completed Successfully"
          echo "======================================"

          echo ""

          echo "Docker Image:"
          echo "$DOCKERHUB_USERNAME/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo ""

          echo "Kind Cluster:"
          echo "${{ env.KIND_CLUSTER }}"

          echo ""

          echo "Helm Release:"
          echo "${{ env.HELM_RELEASE }}"

          echo ""

          echo "Deployment:"
          echo "${{ env.HELM_RELEASE }}"

          echo ""

          echo "Rollout:"
          echo "SUCCESS"
