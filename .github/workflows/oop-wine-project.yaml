# ==========================================================
# MLOps Wine CI/CD Pipeline
#
# Pipeline Flow
#
# Developer Push
#       │
#       ▼
# Checkout Source Code
#       │
#       ▼
# Install Python
#       │
#       ▼
# Install Dependencies
#       │
#       ▼
# Run Unit Tests
#       │
#       ▼
# Train Machine Learning Model
#       │
#       ▼
# Log Experiment + Register Model with MLflow
#       │
#       ▼
# Login to Docker Hub
#       │
#       ▼
# Build Docker Image with Git SHA
#       │
#       ▼
# Scan Image with Trivy
#       │
#       ▼
# Push Docker Image to Docker Hub
#       │
#       ▼
# Verify joe-cluster
#       │
#       ▼
# Configure kubectl
#       │
#       ▼
# Load Exact Image into Kind
#       │
#       ▼
# Deploy with Helm
#       │
#       ▼
# Verify Deployed Image
#       │
#       ▼
# Wait for Rolling Deployment
#       │
#       ├── SUCCESS → Verify Kubernetes
#       │
#       └── FAILURE → Collect Kubernetes Diagnostics
# ==========================================================

name: Oop Wine CI/CD Pipeline


# ==========================================================
# TRIGGER
# ==========================================================

on:
  push:
    branches:
      - main


# ==========================================================
# ENVIRONMENT VARIABLES
# ==========================================================

env:

  # Python version
  PYTHON_VERSION: "3.12"

  # Docker image name
  IMAGE_NAME: oop-wine-streamlit-app

  # Git commit SHA = immutable image version
  IMAGE_TAG: ${{ github.sha }}

  # Helm release - matches app.name in helm/wine/values.yaml,
  # which is what the actual Deployment object is named in-cluster
  HELM_RELEASE: oop-wine-app

  # Helm chart
  HELM_CHART: ./helm/wine

  # Kind cluster
  KIND_CLUSTER: joe-cluster


# ==========================================================
# JOBS
# ==========================================================

jobs:


  # ========================================================
  # JOB 1
  # Build
  # Test
  # Train
  # MLflow
  # Docker Build
  # Trivy Vulnerability Scan
  # Docker Push
  # ========================================================

  build-train:

    runs-on: self-hosted

    steps:

      # ------------------------------------------------------
      # STEP 1: Checkout
      # ------------------------------------------------------

      - name: Checkout Source Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 2: Setup Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # ------------------------------------------------------
      # STEP 3: Install Dependencies
      # ------------------------------------------------------

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip wheel
          if [ -f requirements-dev.txt ]; then
            pip install --only-binary pandas,numpy,scikit-learn,scipy \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -r requirements-dev.txt
          fi

          if [ -f requirements.txt ]; then
            pip install --only-binary pandas,numpy,scikit-learn,scipy \
              --extra-index-url https://download.pytorch.org/whl/cpu \
              -r requirements.txt
          fi


      # ------------------------------------------------------
      # STEP 4: Run Unit Tests
      # ------------------------------------------------------

      - name: Run Unit Tests
        run: |
          python -m pytest


      # ------------------------------------------------------
      # STEP 5: Train Model + Log/Register with MLflow
      # ------------------------------------------------------

      - name: Train Machine Learning Model
        run: |
          python src/main.py


      # ------------------------------------------------------
      # STEP 6: Copy Trained Model into the App Folder
      #
      # app/apps.py loads the model from its own directory as
      # "wine_quality_model.pkl". Training outputs a
      # differently-named file to a different folder, so we
      # bridge the two here, right before the Docker build.
      # ------------------------------------------------------

      - name: Copy Model for Docker Build
        run: |
          cp artifacts/models/wine_quality.pkl app/wine_quality_model.pkl


      # ------------------------------------------------------
      # STEP 7: Login to Docker Hub
      # ------------------------------------------------------

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin


      # ------------------------------------------------------
      # STEP 8: Build Docker Image with Git SHA
      #
      # -f points at the Dockerfile; the trailing "." sets the
      # build context to the REPO ROOT, which is what the
      # Dockerfile's "COPY app/..." lines expect.
      # ------------------------------------------------------

      - name: Build Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Building: $IMAGE"
          docker build -t "$IMAGE" -f app/Dockerfile .


      # ------------------------------------------------------
      # STEP 9: Scan Image with Trivy
      # ------------------------------------------------------

      - name: Scan Image with Trivy
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          trivy image --exit-code 0 --severity HIGH,CRITICAL "$IMAGE"


      # ------------------------------------------------------
      # STEP 10: Push Docker Image to Docker Hub
      # ------------------------------------------------------

      - name: Push Docker Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          docker push "$IMAGE"


  # ========================================================
  # JOB 2
  # Kubernetes + Helm Deployment
  # ========================================================

  deploy:

    needs: build-train

    runs-on: self-hosted

    steps:


      # ------------------------------------------------------
      # STEP 12: Checkout Repository
      # ------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 13: Verify Docker
      # ------------------------------------------------------

      - name: Verify Docker
        run: |

          echo "======================================"
          echo "Docker Version"
          echo "======================================"

          docker version


      # ------------------------------------------------------
      # STEP 14: Verify Kind
      # ------------------------------------------------------

      - name: Verify Kind
        run: |

          echo "======================================"
          echo "Kind Version"
          echo "======================================"

          kind version

          echo ""
          echo "Available Kind Clusters:"

          kind get clusters


      # ------------------------------------------------------
      # STEP 15: Verify joe-cluster
      # ------------------------------------------------------

      - name: Verify joe-cluster
        run: |

          echo "======================================"
          echo "Checking Kind Cluster"
          echo "======================================"

          kind get clusters | grep -x "${{ env.KIND_CLUSTER }}"

          echo "joe-cluster exists."


      # ------------------------------------------------------
      # STEP 16: Configure kubectl
      # ------------------------------------------------------

      - name: Configure kubectl for joe-cluster
        run: |

          echo "======================================"
          echo "Configuring kubectl"
          echo "======================================"

          kind export kubeconfig \
            --name ${{ env.KIND_CLUSTER }}

          kubectl config use-context \
            kind-${{ env.KIND_CLUSTER }}


      # ------------------------------------------------------
      # STEP 17: Verify Kubernetes
      # ------------------------------------------------------

      - name: Verify Kubernetes Cluster
        run: |

          echo "======================================"
          echo "Kubernetes Cluster"
          echo "======================================"

          kubectl config current-context

          echo ""

          kubectl get nodes -o wide

          echo ""

          kubectl cluster-info


      # ------------------------------------------------------
      # STEP 18: Load Exact Git SHA Image into Kind
      # ------------------------------------------------------

      - name: Load Image into joe-cluster
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Loading Exact Image into Kind"
          echo "======================================"

          IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Image:"
          echo "$IMAGE"

          kind load docker-image \
            --name ${{ env.KIND_CLUSTER }} \
            "$IMAGE"


      # ------------------------------------------------------
      # STEP 19: Verify Image Inside Kind
      # ------------------------------------------------------

      - name: Verify Image in Kind
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Verifying Image Inside Kind"
          echo "======================================"

          IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          docker exec \
            ${{ env.KIND_CLUSTER }}-control-plane \
            crictl images | grep "${{ env.IMAGE_NAME }}" || true

          echo ""
          echo "Expected image:"
          echo "$IMAGE"


      # ------------------------------------------------------
      # STEP 20: Verify Helm
      # ------------------------------------------------------

      - name: Verify Helm
        run: |

          echo "======================================"
          echo "Helm Version"
          echo "======================================"

          helm version


      # ------------------------------------------------------
      # STEP 21: Helm Lint
      # ------------------------------------------------------

      - name: Helm Lint
        run: |

          echo "======================================"
          echo "Helm Lint"
          echo "======================================"

          helm lint ${{ env.HELM_CHART }}


      # ------------------------------------------------------
      # STEP 22: Deploy with Helm
      # ------------------------------------------------------

      - name: Deploy Application with Helm
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Deploying Application"
          echo "======================================"

          IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}"

          echo "Repository:"
          echo "$IMAGE"

          echo "Tag:"
          echo "${{ env.IMAGE_TAG }}"

          helm upgrade --install \
            ${{ env.HELM_RELEASE }} \
            ${{ env.HELM_CHART }} \
            --set image.repository="$IMAGE" \
            --set image.tag="${{ env.IMAGE_TAG }}" \
            --set image.pullPolicy=IfNotPresent \
            --set replicaCount=3 \
            --wait=false


      # ------------------------------------------------------
      # STEP 23: Verify Deployed Image
      # ------------------------------------------------------

      - name: Verify Deployed Image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "Verifying Kubernetes Image"
          echo "======================================"

          DEPLOYED_IMAGE=$(kubectl get deployment ${{ env.HELM_RELEASE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}')

          EXPECTED_IMAGE="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo "Expected:"
          echo "$EXPECTED_IMAGE"

          echo ""

          echo "Deployed:"
          echo "$DEPLOYED_IMAGE"

          echo ""

          if [ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Kubernetes is running the wrong image."
            exit 1
          fi

          echo "Correct image is deployed."


      # ------------------------------------------------------
      # STEP 24: Show Rollout Status
      # ------------------------------------------------------

      - name: Show Rollout Status
        run: |

          echo "======================================"
          echo "Current Rollout Status"
          echo "======================================"

          kubectl rollout status \
            deployment/${{ env.HELM_RELEASE }} \
            --timeout=10s || true


      # ------------------------------------------------------
      # STEP 25: Wait for Deployment
      # ------------------------------------------------------

      - name: Wait for Deployment
        run: |

          echo "======================================"
          echo "Waiting for Kubernetes Rollout"
          echo "======================================"

          kubectl rollout status \
            deployment/${{ env.HELM_RELEASE }} \
            --timeout=300s


      # ------------------------------------------------------
      # STEP 26: Verify Pods
      # ------------------------------------------------------

      - name: Verify Pods
        run: |

          echo "======================================"
          echo "Pods Status"
          echo "======================================"

          kubectl get pods \
            -o wide


      # ------------------------------------------------------
      # STEP 27: Verify Services
      # ------------------------------------------------------

      - name: Verify Services
        run: |

          echo "======================================"
          echo "Services Status"
          echo "======================================"

          kubectl get svc


      # ------------------------------------------------------
      # STEP 28: Verify Deployments
      # ------------------------------------------------------

      - name: Verify Deployments
        run: |

          echo "======================================"
          echo "Deployment Status"
          echo "======================================"

          kubectl get deployments


      # ------------------------------------------------------
      # STEP 29: Describe Deployment
      # ------------------------------------------------------

      - name: Describe Deployment
        run: |

          echo "======================================"
          echo "Deployment Description"
          echo "======================================"

          kubectl describe deployment ${{ env.HELM_RELEASE }}


      # ======================================================
      # FAILURE DIAGNOSTICS
      #
      # These steps execute ONLY if something above fails.
      # ======================================================


      # ------------------------------------------------------
      # STEP 30: Debug Pods
      # ------------------------------------------------------

      - name: DEBUG - Kubernetes Pods
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: PODS"
          echo "======================================"

          kubectl get pods \
            -o wide


      # ------------------------------------------------------
      # STEP 31: Debug ReplicaSets
      # ------------------------------------------------------

      - name: DEBUG - ReplicaSets
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: REPLICASETS"
          echo "======================================"

          kubectl get replicasets \
            -o wide


      # ------------------------------------------------------
      # STEP 32: Debug Deployment
      # ------------------------------------------------------

      - name: DEBUG - Deployment
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: DEPLOYMENT"
          echo "======================================"

          kubectl describe deployment ${{ env.HELM_RELEASE }}


      # ------------------------------------------------------
      # STEP 33: Debug Pods
      # ------------------------------------------------------

      - name: DEBUG - Describe Pods
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: POD DESCRIPTIONS"
          echo "======================================"

          kubectl describe pods \
            -l app=${{ env.HELM_RELEASE }}


      # ------------------------------------------------------
      # STEP 34: Debug Events
      # ------------------------------------------------------

      - name: DEBUG - Kubernetes Events
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: KUBERNETES EVENTS"
          echo "======================================"

          kubectl get events \
            --sort-by=.lastTimestamp


      # ------------------------------------------------------
      # STEP 35: Debug Logs
      # ------------------------------------------------------

      - name: DEBUG - Application Logs
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: APPLICATION LOGS"
          echo "======================================"

          kubectl logs \
            -l app=${{ env.HELM_RELEASE }} \
            --all-containers=true \
            --tail=200 \
            --prefix=true || true


      # ------------------------------------------------------
      # STEP 36: Previous Container Logs
      # ------------------------------------------------------

      - name: DEBUG - Previous Container Logs
        if: failure()
        run: |

          echo "======================================"
          echo "DEBUG: PREVIOUS CONTAINER LOGS"
          echo "======================================"

          for POD in $(kubectl get pods \
            -l app=${{ env.HELM_RELEASE }} \
            -o jsonpath='{.items[*].metadata.name}'); do

            echo ""
            echo "======================================"
            echo "Pod: $POD"
            echo "======================================"

            kubectl logs "$POD" \
              --previous \
              --all-containers=true \
              --tail=200 || true

          done


      # ------------------------------------------------------
      # STEP 37: Final Kubernetes State
      # ------------------------------------------------------

      - name: DEBUG - Final Kubernetes State
        if: failure()
        run: |

          echo "======================================"
          echo "FINAL KUBERNETES STATE"
          echo "======================================"

          kubectl get all -l app=${{ env.HELM_RELEASE }}

          echo ""

          kubectl get deployment ${{ env.HELM_RELEASE }} \
            -o yaml


      # ------------------------------------------------------
      # STEP 38: Final Verification
      # ------------------------------------------------------

      - name: Final Kubernetes Verification
        run: |

          echo "======================================"
          echo "FINAL KUBERNETES VERIFICATION"
          echo "======================================"

          echo "Cluster:"
          echo "${{ env.KIND_CLUSTER }}"

          echo ""

          echo "Context:"
          kubectl config current-context

          echo ""

          kubectl get nodes

          echo ""

          kubectl get pods

          echo ""

          kubectl get svc

          echo ""

          kubectl get deployments


      # ------------------------------------------------------
      # STEP 39: Completion Summary
      # ------------------------------------------------------

      - name: Pipeline Completed Successfully
        if: success()
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |

          echo "======================================"
          echo "MLOps Pipeline Completed Successfully"
          echo "======================================"

          echo "Docker Image:"
          echo "${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo ""

          echo "Kind Cluster:"
          echo "${{ env.KIND_CLUSTER }}"

          echo ""

          echo "Helm Release:"
          echo "${{ env.HELM_RELEASE }}"

          echo ""

          echo "Deployment:"
          echo "${{ env.HELM_RELEASE }}"

          echo ""

          echo "Rollout:"
          echo "SUCCESS"