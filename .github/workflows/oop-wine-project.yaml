name: Oop Wine CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: oop-wine-streamlit-app
  IMAGE_TAG: ${{ github.sha }}
  HELM_RELEASE: Oop-wine-app
  HELM_CHART: ./helm/wine
  KIND_CLUSTER: joe-cluster
  K8S_NAMESPACE: dev

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # ------------------------------------------------------
      # STEP 1: Checkout Source Code
      # ------------------------------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # STEP 2: Setup Python
      # ------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ------------------------------------------------------
      # STEP 3: Install Dependencies
      # ------------------------------------------------------
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ------------------------------------------------------
      # STEP 4: Build Local Docker Image (Handles Empty Secret Safely)
      # ------------------------------------------------------
      - name: Build Docker Image Locally
        run: |
          echo "======================================"
          echo "Building Docker Image"
          echo "======================================"

          DUSER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -n "$DUSER" ]; then
            TARGET_IMAGE="${DUSER}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          else
            TARGET_IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          fi

          echo "Target Image Tag: ${TARGET_IMAGE}"
          docker build -t "${TARGET_IMAGE}" .

      # ------------------------------------------------------
      # STEP 5: Verify Kind Cluster Context
      # ------------------------------------------------------
      - name: Configure kubectl Context
        run: |
          kind export kubeconfig --name ${{ env.KIND_CLUSTER }}
          kubectl config use-context kind-${{ env.KIND_CLUSTER }}

      # ------------------------------------------------------
      # STEP 6: Load Image into Kind Cluster
      # ------------------------------------------------------
      - name: Load Image into Kind
        run: |
          echo "======================================"
          echo "Loading Exact Image into Kind"
          echo "======================================"

          DUSER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -n "$DUSER" ]; then
            TARGET_IMAGE="${DUSER}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          else
            TARGET_IMAGE="${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          fi

          echo "Loading Image: ${TARGET_IMAGE}"
          kind load docker-image "${TARGET_IMAGE}" --name ${{ env.KIND_CLUSTER }}

      # ------------------------------------------------------
      # STEP 7: Deploy via Helm
      # ------------------------------------------------------
      - name: Deploy Application with Helm
        run: |
          echo "======================================"
          echo "Deploying Application via Helm"
          echo "======================================"

          DUSER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -n "$DUSER" ]; then
            REPO_PATH="${DUSER}/${{ env.IMAGE_NAME }}"
          else
            REPO_PATH="${{ env.IMAGE_NAME }}"
          fi

          # Ensure target namespace exists
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install \
            ${{ env.HELM_RELEASE }} \
            ${{ env.HELM_CHART }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --set image.repository="${REPO_PATH}" \
            --set image.tag="${{ env.IMAGE_TAG }}" \
            --set image.pullPolicy=IfNotPresent \
            --wait=false

      # ------------------------------------------------------
      # STEP 8: Verify Deployment Rollout (Dynamic Name Lookup)
      # ------------------------------------------------------
      - name: Verify Rollout Status
        run: |
          echo "======================================"
          echo "Verifying Kubernetes Deployment"
          echo "======================================"

          # Dynamically resolve deployment name created by Helm in target namespace
          DEPLOYMENT_NAME=$(kubectl get deployments -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.items[0].metadata.name}')
          
          if [ -z "$DEPLOYMENT_NAME" ]; then
            echo "Error: No deployment found in namespace ${{ env.K8S_NAMESPACE }}"
            exit 1
          fi

          echo "Found deployment: ${DEPLOYMENT_NAME}"
          kubectl rollout status "deployment/${DEPLOYMENT_NAME}" -n ${{ env.K8S_NAMESPACE }} --timeout=120s

      # ------------------------------------------------------
      # STEP 9: Check Resources in Target Namespace
      # ------------------------------------------------------
      - name: Inspect Cluster Resources
        run: |
          echo "======================================"
          echo "FINAL KUBERNETES STATE (${{ env.K8S_NAMESPACE }})"
          echo "======================================"
          kubectl get all -n ${{ env.K8S_NAMESPACE }} -o wide